<!doctype html><meta charset="utf-8">
<!-- Renders the OG frame. Open at 1200x630 and screenshot; see scripts/make-og.sh -->
<link rel="stylesheet" href="../assets/design-tokens.css">
<style>
  html,body{margin:0;background:var(--bg);overflow:hidden}
  .frame{position:relative;width:1200px;height:630px;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .mark{position:absolute;left:64px;bottom:56px;font:600 46px/1 var(--font-sans);
        letter-spacing:-.02em;color:var(--ink)}
  .sub{position:absolute;left:64px;bottom:26px;font:400 19px/1 var(--font-sans);color:var(--ink-muted)}
</style>
<div class="frame">
  <canvas data-field data-frozen="1"></canvas>
  <div class="mark">Graphene</div>
  <div class="sub">Draw the route. Sign the map. Watch your agents keep to it.</div>
</div>
<script src="../assets/field.js"></script>
