<!-- Styles are inlined and the mark is inline SVG on purpose: GitHub Pages serves

     not resolve. Self-contained means zero missing requests from /a/b/c. -->
<style>
  :root { --bg:#f3eee4; --ink:#242622; --ink-muted:#66675f; --accent:#9a4f24;

  *,*::before,*::after { box-sizing:border-box }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font:400 17px/1.6 var(--font-sans); display:grid; place-content:center;
         padding:32px; text-align:left }
  main { max-width:34rem }
  svg { display:block; margin-bottom:30px }
  h1 { font-size:clamp(1.9rem,5vw,2.8rem); line-height:1.08; letter-spacing:-.02em;
       font-weight:600; margin:0 0 14px }
  p { color:var(--ink-muted); margin:0 0 26px }
  a.btn { display:inline-block; padding:12px 20px; min-height:44px; text-decoration:none;
          color:var(--bg); background:var(--ink); border:1px solid var(--ink) }
  a.btn:hover { background:var(--accent); border-color:var(--accent) }
  a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
</style>
</head>
