<style>

  svg.flock { display: block; width: min(320px, 80vw); height: auto; margin-bottom: 36px }

  p { color: #3A3935; margin: 0 0 30px; max-width: 34ch }
  .home { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 999px; background: var(--ink); color: var(--strip); text-decoration: none; font-weight: 500; font-size: 15px }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px }
